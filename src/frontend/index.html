<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion / Inscription</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="container">
    <h1>Bienvenue !</h1>

    <form id="signup" class="form">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Mot de passe" required>
      <input type="password" name="confirm_password" placeholder="Confirmer mot de passe" required>
      <input type="submit" value="S'inscrire">
      <p>Vous avez déjà un compte ? <span class="link" id="toSignin">Se connecter</span></p>
    </form>

    <form id="signin" class="form">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Mot de passe" required>
      <input type="submit" value="Se connecter">
      <p>Pas de compte ? <span class="link" id="toSignup">S'inscrire</span></p>
    </form>

  </div>

  <script src="index.js"></script>
</body>
</html>
